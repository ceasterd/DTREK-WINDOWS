name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string](($props.Project.PropertyGroup | Where-Object { $_.DtrekVersion } | Select-Object -First 1).DtrekVersion)
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match project version v$version."
          }

      - name: Build, test, and package
        shell: pwsh
        run: .\scripts\build.ps1 -Test -Package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dtrek-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: DTREK ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*-setup.exe
